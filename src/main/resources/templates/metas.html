<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: main-layout('Seguimiento a Metas', ~{::section})}">
<body>
<section>
    <!-- Encabezado con Selector de Proyecto y Botón Crear Meta -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0"><i class="fa-solid fa-bullseye text-warning me-2"></i>Seguimiento Físico a Metas PDD</h3>
        
        <div class="d-flex align-items-center gap-2">
            <form method="get" action="/metas" class="d-flex align-items-center gap-2">
                <select name="proyectoId" class="form-select fw-bold border-primary" onchange="this.form.submit()">
                    <option th:each="p : ${proyectos}" 
                            th:value="${p.id}" 
                            th:text="${'BPIN ' + p.codigoBpin + ' - ' + p.nombre}"
                            th:selected="${proyecto != null and p.id == proyecto.id}">
                    </option>
                </select>
            </form>

            <button class="btn btn-outline-primary text-nowrap" data-bs-toggle="modal" data-bs-target="#modalCrearMeta">
                <i class="fa-solid fa-plus me-1"></i> Nueva Meta
            </button>
        </div>
    </div>

    <div class="row g-4">
        <!-- Tabla Principal de Metas -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0"><i class="fa-solid fa-list-check me-2 text-primary"></i>Metas y Avance Físico</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0" style="font-size: 0.9rem;">
                            <thead class="table-light">
                                <tr>
                                    <th>Cód. / Tipo</th>
                                    <th>Meta</th>
                                    <th>Unidad</th>
                                    <th class="text-end">Programado</th>
                                    <th class="text-end">Ejecutado</th>
                                    <th style="width: 140px;">% Avance</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="m : ${metas}">
                                    <td>
                                        <span class="badge mb-1 d-block" 
                                              th:classappend="${m.tipoMeta == 'RESULTADO' ? 'bg-info text-dark' : 'bg-primary'}"
                                              th:text="${m.tipoMeta}">RESULTADO</span>
                                        <small class="fw-bold text-muted" th:if="${m.codigoPrograma != null}" th:text="${m.codigoPrograma}">02-01-04</small>
                                    </td>
                                    <td class="fw-semibold" th:text="${m.descripcion}">Descripción Meta</td>
                                    <td th:text="${m.unidadMedida}">Unidad</td>
                                    <td class="text-end fw-bold" th:text="${#numbers.formatDecimal(m.programadoAnual, 1, 'POINT', 0, 'COMMA')}">0</td>
                                    <td class="text-end fw-bold text-success" th:text="${#numbers.formatDecimal(m.totalEjecutado, 1, 'POINT', 0, 'COMMA')}">0</td>
                                    
                                    <!-- Barra de Progreso Dinámica -->
                                    <td>
                                        <div class="d-flex align-items-center gap-2">
                                            <div class="progress flex-grow-1" style="height: 16px;">
                                                <div class="progress-bar bg-warning text-dark fw-bold" 
                                                     role="progressbar" 
                                                     th:style="'width: ' + ${m.porcentajeCumplimiento} + '%'"
                                                     th:text="${m.porcentajeCumplimiento + '%'}">0%</div>
                                            </div>
                                        </div>
                                    </td>
                                </tr>
                                <tr th:if="${metas == null or metas.isEmpty()}">
                                    <td colspan="6" class="text-center text-muted py-4">No hay metas registradas para este proyecto. Clic en <strong>"Nueva Meta"</strong> para agregar una.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario de Reporte de Avance Trimestral -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white py-3">
                    <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-pen-to-square text-warning me-2"></i>Reportar Avance Trimestral</h5>
                </div>
                <div class="card-body">
                    <form method="post" action="/metas/avance">
                        <input type="hidden" name="proyectoId" th:value="${proyecto != null ? proyecto.id : ''}">

                        <!-- 1. Selección de Tipo de Meta -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">1. Seleccionar Tipo de Meta</label>
                            <select id="selectTipoMeta" class="form-select" onchange="cargarMetasPorTipo()">
                                <option value="" selected>-- Todas las Metas --</option>
                                <option value="RESULTADO">Meta de Resultado (Política Pública)</option>
                                <option value="PRODUCTO">Meta de Producto (Cuatrienio)</option>
                            </select>
                        </div>

                        <!-- 2. Selección de la Meta -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">2. Seleccionar Meta a Reportar</label>
                            <select id="selectMeta" name="metaId" class="form-select" required>
                                <option value="" disabled selected>-- Elija una Meta --</option>
                                <option th:each="m : ${metas}" 
                                        th:value="${m.id}" 
                                        th:text="${(m.codigoPrograma != null ? '[' + m.codigoPrograma + '] ' : '') + m.descripcion}">
                                </option>
                            </select>
                        </div>

                        <!-- 3. Período Trimestre y Vigencia -->
                        <div class="row g-2 mb-3">
                            <div class="col-md-7">
                                <label class="form-label fw-bold">Trimestre</label>
                                <select name="periodoTrimestre" class="form-select" required>
                                    <option value="1">Trimestre 1 (Marzo)</option>
                                    <option value="2">Trimestre 2 (Junio)</option>
                                    <option value="3">Trimestre 3 (Septiembre)</option>
                                    <option value="4">Trimestre 4 (Diciembre)</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label fw-bold">Vigencia</label>
                                <input type="number" name="vigencia" class="form-control fw-bold" value="2026" required>
                            </div>
                        </div>

                        <!-- 4. Valor Logrado -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Valor Logrado en este Trimestre</label>
                            <input type="number" step="0.01" name="valorLogrado" class="form-control" placeholder="Ej: 14" required>
                        </div>

                        <!-- 5. Observaciones -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Observaciones / Soporte</label>
                            <textarea name="observaciones" class="form-control" rows="2" placeholder="Soporte o detalles del avance..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-warning w-100 fw-bold">
                            <i class="fa-solid fa-check me-1"></i> Registrar Avance Físico
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Crear Meta -->
    <div class="modal fade" id="modalCrearMeta" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Crear Nueva Meta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form method="post" action="/metas/crear">
                    <input type="hidden" name="proyectoId" th:value="${proyecto != null ? proyecto.id : ''}">
                    <div class="modal-body">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tipo de Meta</label>
                                <select name="tipoMeta" class="form-select" required>
                                    <option value="RESULTADO">Meta de Resultado</option>
                                    <option value="PRODUCTO" selected>Meta de Producto</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Código Programa</label>
                                <input type="text" name="codigoPrograma" class="form-control" placeholder="Ej: 02-01-04">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Descripción de la Meta</label>
                            <textarea name="descripcion" class="form-control" rows="2" placeholder="Ej: Construcción de 5 aulas nuevas" required></textarea>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Unidad de Medida</label>
                                <input type="text" name="unidadMedida" class="form-control" placeholder="Ej: Aulas / Sedes" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Programado Anual</label>
                                <input type="number" step="0.01" name="programadoAnual" class="form-control" placeholder="Ej: 300" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary fw-bold">Guardar Meta</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript para Filtrado Dinámico -->
    <script th:inline="javascript">
        function cargarMetasPorTipo() {
            const proyectoId = /*[[${proyecto != null ? proyecto.id : null}]]*/ null;
            if (!proyectoId) return;

            const tipo = document.getElementById('selectTipoMeta').value;
            const selectMeta = document.getElementById('selectMeta');

            fetch(`/api/metas?proyectoId=${proyectoId}&tipoMeta=${tipo}`)
                .then(res => res.json())
                .then(data => {
                    selectMeta.innerHTML = '<option value="" disabled selected>-- Elija una Meta --</option>';
                    data.forEach(m => {
                        const opt = document.createElement('option');
                        opt.value = m.id;
                        const cod = m.codigoPrograma ? `[${m.codigoPrograma}] ` : '';
                        opt.textContent = `${cod}${m.descripcion}`;
                        selectMeta.appendChild(opt);
                    });
                })
                .catch(err => console.error("Error al cargar metas:", err));
        }
    </script>
</section>
</body>
</html>
