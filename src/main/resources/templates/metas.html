<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: main-layout('Plan de Acción - Metas', ~{::section})}">
<body>
<section>
    <h3 class="fw-bold mb-4"><i class="fa-solid fa-bullseye text-warning me-2"></i>Seguimiento Físico a Metas PDD</h3>

    <div class="row g-4">
        <!-- Tabla de Metas -->
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>Programa</th>
                                    <th>Meta Producto PDD</th>
                                    <th>Unidad</th>
                                    <th>Programado 2026</th>
                                    <th>% Cumplimiento</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="m, iter : ${resumenMetas}">
                                    <td class="fw-bold text-muted" th:text="${metas[iter.index].codigoPrograma}">02-02-07</td>
                                    <td th:text="${m.descripcionMeta}">Descripción</td>
                                    <td th:text="${m.unidadMedida}">Número</td>
                                    <td class="fw-bold" th:text="${m.metaProgramadaVigencia}">15</td>
                                    <td>
                                        <div class="progress" style="height: 20px;">
                                            <div class="progress-bar bg-warning text-dark fw-bold" 
                                                 role="progressbar" 
                                                 th:style="'width: ' + ${m.porcentajeAvanceSimple} + '%'"
                                                 th:text="${m.porcentajeAvanceSimple + '%'}">0%</div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Formulario de Reporte Trimestral -->
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-3 bg-white">
                <h5 class="fw-bold mb-3"><i class="fa-solid fa-pen-to-square text-primary me-2"></i>Reportar Avance Trimestral</h5>
                <form method="post" action="/metas/reportar">
                    <div class="mb-3">
                        <label class="form-label">Meta de Producto</label>
                        <select name="metaProductoId" class="form-select" required>
                            <option th:each="meta : ${metas}" th:value="${meta.id}" th:text="${meta.descripcionMeta}"></option>
                        </select>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label">Trimestre</label>
                            <select name="trimestre" class="form-select" required>
                                <option value="1">Trimestre 1 (Marzo)</option>
                                <option value="2" selected>Trimestre 2 (Junio)</option>
                                <option value="3">Trimestre 3 (Septiembre)</option>
                                <option value="4">Trimestre 4 (Diciembre)</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Vigencia</label>
                            <input type="number" name="vigencia" class="form-control" value="2026" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Valor Logrado en este Trimestre</label>
                        <input type="number" step="0.01" name="valorLogrado" class="form-control" placeholder="Ej: 5" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Observaciones / Soporte</label>
                        <textarea name="observaciones" class="form-control" rows="2" placeholder="Notas sobre el avance..."></textarea>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Registrar Avance Físico</button>
                </form>
            </div>
        </div>
    </div>
</section>
</body>
</html>
