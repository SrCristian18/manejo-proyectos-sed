<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: main-layout('Seguimiento y Cumplimiento de Metas', ~{::section})}">
<body>
<section>
    <div class="mb-4">
        <h3 class="fw-bold mb-0"><i class="fa-solid fa-chart-line text-success me-2"></i>Reporte de Avances de Actividades</h3>
        <p class="text-muted">Registro de ejecución física y su correspondencia al cumplimiento de metas</p>
    </div>

    <!-- Tabla Exclusiva para Reportar Avances de Actividades -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Proyecto / Actividad</th>
                            <th>Meta Producto Asociada</th>
                            <th>Meta Cuatrienio</th>
                            <th>Avance Acumulado</th>
                            <th>% Avance</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="act : ${actividades}">
                            <td>
                                <div class="fw-bold text-dark" th:text="${act.nombre}">Nombre Actividad</div>
                                <div class="small text-muted" th:text="${'Proyecto: ' + act.proyecto.nombre}">Proyecto</div>
                            </td>
                            <td class="small" th:text="${act.proyecto.metaProducto != null ? act.proyecto.metaProducto.descripcion : 'Sin Asignar'}">Meta Producto</td>
                            <td class="fw-bold" th:text="${act.proyecto.metaProducto != null ? act.proyecto.metaProducto.metaCuatrienio : 0}">100</td>
                            <td class="text-success fw-bold" th:text="${act.avanceAcumulado}">45</td>
                            <td>
                                <div class="progress" style="height: 16px;">
                                    <div class="progress-bar bg-success" role="progressbar" 
                                         th:style="'width: ' + ${act.porcentajeAvance} + '%'" 
                                         th:text="${act.porcentajeAvance + '%'}">45%</div>
                                </div>
                            </td>
                            <td class="text-center">
                                <button class="btn btn-sm btn-outline-primary" 
                                        th:onclick="abrirModalReporteAvance([[${act.id}]], [[${act.nombre}]])">
                                    <i class="fa-solid fa-plus-circle me-1"></i> Reportar Avance
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
