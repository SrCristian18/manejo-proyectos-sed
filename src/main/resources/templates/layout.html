<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="main-layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Gestión Presupuestal y Metas - SED Cartagena</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .sidebar-brand { font-weight: bold; color: #0d6efd; }
        .card-counter { border-left: 5px solid #0d6efd; }
        .card-counter-success { border-left: 5px solid #198754; }
        .card-counter-warning { border-left: 5px solid #ffc107; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="fa-solid fa-graduation-cap me-2"></i>Gestor SED - Proyectos de Inversión
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/"><i class="fa-solid fa-chart-line me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/presupuesto"><i class="fa-solid fa-wallet me-1"></i> Seguimiento Presupuestal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/metas"><i class="fa-solid fa-bullseye me-1"></i> Plan de Acción / Metas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/proyectos"><i class="fa-solid fa-folder-tree me-1"></i> Proyectos y PDD</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <main class="container my-4" th:replace="${content}">
        <!-- Aquí se inyecta la vista correspondiente -->
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-muted border-top bg-white mt-auto">
        <small>Secretaría de Educación Superior - Sistema de Gestión de Proyectos de Inversión &copy; 2026</small>
    </footer>

    <!-- Bootstrap 5 JS Bundle CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
