<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: main-layout('Estructura PDD y Proyectos', ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold mb-0"><i class="fa-solid fa-sitemap text-primary me-2"></i>Estructura PDD 2024-2027</h3>
            <p class="text-muted mb-0">Configuración jerárquica del Plan de Desarrollo Distrital</p>
        </div>
        <div>
            <button class="btn btn-primary fw-bold" data-bs-toggle="modal" data-bs-target="#modalCrearProyecto">
                <i class="fa-solid fa-plus me-1"></i> Nuevo Proyecto
            </button>
        </div>
    </div>

    <!-- Acordeón Jerárquico PDD -->
    <div class="accordion shadow-sm border-0" id="accordionPDD">
        <div class="accordion-item mb-2 border rounded" th:each="linea : ${lineasEstrategicas}">
            <h2 class="accordion-header">
                <button class="accordion-button collapsed fw-bold bg-light" type="button" 
                        th:data-bs-toggle="'collapse'" 
                        th:data-bs-target="'#collapseLinea' + ${linea.id}">
                    <span class="badge bg-primary me-2" th:text="${linea.codigo}">L1</span>
                    <span th:text="${linea.nombre}">Línea Estratégica</span>
                    <span class="ms-auto text-muted me-3 small" th:text="${linea.odsRelacionado}">ODS</span>
                </button>
            </h2>
            <div th:id="'collapseLinea' + ${linea.id}" class="accordion-collapse collapse" data-bs-parent="#accordionPDD">
                <div class="accordion-body">
                    <!-- Impulsores de Avance -->
                    <div class="ms-3 mb-3" th:each="impulsor : ${linea.impulsores}">
                        <h6 class="fw-bold text-secondary">
                            <i class="fa-solid fa-angles-right text-info me-1"></i>
                            <span th:text="${impulsor.codigo + ' - ' + impulsor.nombre}">Impulsor</span>
                        </h6>
                        
                        <!-- Metas de Resultado -->
                        <div class="ms-3 mb-2" th:each="metaRes : ${impulsor.metasResultado}">
                            <div class="p-2 bg-light-subtle rounded border mb-2">
                                <span class="badge bg-secondary me-1" th:text="${metaRes.codigo}">MR</span>
                                <strong th:text="${metaRes.descripcion}">Meta Resultado</strong>
                                
                                <!-- Programas -->
                                <div class="ms-4 mt-2" th:each="prog : ${metaRes.programas}">
                                    <div class="text-dark fw-semibold small">
                                        <i class="fa-solid fa-folder-tree text-warning me-1"></i>
                                        <span th:text="${prog.codigo + ' - ' + prog.nombre}">Programa</span>
                                    </div>

                                    <!-- Metas Producto -->
                                    <div class="ms-4 my-1" th:each="metaProd : ${prog.metasProducto}">
                                        <div class="d-flex justify-content-between align-items-center bg-white p-2 rounded border-start border-3 border-info">
                                            <div>
                                                <span class="badge bg-info text-dark" th:text="${metaProd.codigo}">MP</span>
                                                <span class="small fw-semibold" th:text="${metaProd.descripcion}">Meta Producto</span>
                                            </div>
                                            <!-- Lista de Proyectos de esta Meta Producto -->
                                            <div>
                                                <span class="badge bg-success" th:text="${metaProd.proyectos.size() + ' Proyectos'}">0 Proyectos</span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
