<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: main-layout('Trazabilidad Presupuestal', ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">
            <i class="fa-solid fa-clock-rotate-left text-primary me-2"></i>Trazabilidad de CDPs, RPs y Modificaciones
        </h3>
        <a href="/presupuesto" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Volver a Seguimiento
        </a>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>Fecha</th>
                            <th>Tipo Movimiento</th>
                            <th>Nº Documento / Decreto</th>
                            <th>Actividad Afectada</th>
                            <th>Fuente</th>
                            <th class="text-end">Monto ($)</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="mov : ${movimientos}">
                            <td th:text="${#temporals.format(mov.fechaRegistro, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                            <td>
                                <span class="badge bg-primary" th:text="${mov.tipoMovimiento}">TIPO</span>
                            </td>
                            <td class="fw-bold text-primary" th:text="${mov.numeroDecreto}">DEC-001</td>
                            <td>
                                <ul class="list-unstyled mb-0" th:each="d : ${mov.detalles}">
                                    <li th:text="${d.actividad.nombre}">Nombre Actividad</li>
                                </ul>
                            </td>
                            <td>
                                <ul class="list-unstyled mb-0" th:each="d : ${mov.detalles}">
                                    <li th:text="${d.fuente}">FUENTE</li>
                                </ul>
                            </td>
                            <td class="text-end fw-bold text-success">
                                <ul class="list-unstyled mb-0" th:each="d : ${mov.detalles}">
                                    <li th:text="${'$' + #numbers.formatDecimal(d.monto, 1, 'POINT', 0, 'COMMA')}">$0</li>
                                </ul>
                            </td>
                        </tr>
                        <tr th:if="${movimientos == null or movimientos.isEmpty()}">
                            <td colspan="6" class="text-center text-muted py-4">No hay historial registrado.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</section>
</body>
</html>
