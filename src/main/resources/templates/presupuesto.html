<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      th:replace="~{layout :: main-layout('Seguimiento Presupuestal', ~{::section})}">
<body>
<section>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0"><i class="fa-solid fa-wallet text-primary me-2"></i>Saldos y Distribución Presupuestal</h3>
                
        <!-- Selector desplegable de Proyectos BPIN -->
        <div class="d-flex align-items-center gap-2" style="min-width: 450px;">
            <form method="get" class="d-flex gap-2">
                <select name="proyectoId" class="form-select fw-bold border-primary" onchange="this.form.submit()">
                    <option th:each="p : ${proyectos}" 
                            th:value="${p.id}" 
                            th:text="${'BPIN ' + p.codigoBpin + ' - ' + p.nombre}"
                            th:selected="${p.id == proyecto.id}">
                    </option>
                </select>
            </form>

            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalMovimiento">
                <i class="fa-solid fa-plus me-1"></i> Registrar Modificación / CDP
            </button>
        </div>
    </div>

    <!-- Tabla de Actividades y Saldos -->
    <div class="card shadow-sm border-0 mb-4">
    <div class="card-header bg-white py-3">
        <h5 class="fw-bold mb-0 text-dark"><i class="fa-solid fa-calculator text-primary me-2"></i>Estado de Ejecución Presupuestal por Actividad</h5>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-bordered table-hover align-middle mb-0" style="font-size: 0.9rem;">
                <thead class="table-light text-center align-middle">
                    <tr>
                        <th rowspan="2" class="text-start">Actividad (Hito)</th>
                        <!-- Cabecera Dinámica por cada Fuente -->
                        <th th:each="f : ${fuentes}" colspan="2" class="fw-bold text-uppercase bg-light-subtle" th:text="${f}">FUENTE</th>
                        <th rowspan="2" class="text-end bg-light fw-bold">Disponible Total ($)</th>
                        <th rowspan="2" style="width: 130px;">% Ejecución</th>
                    </tr>
                    <tr>
                        <!-- Subcabeceras repetidas dinámicamente -->
                        <th:block th:each="f : ${fuentes}">
                            <th class="text-end small">Aprop. Definitiva</th>
                            <th class="text-end small text-success">Disponible</th>
                        </th:block>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${resumenPresupuestal}">
                        <td class="fw-semibold" th:text="${item.nombreActividad}">Actividad</td>
                        
                        <!-- Columnas Dinámicas de Valores por Fuente -->
                        <th:block th:each="f : ${fuentes}">
                            <td class="text-end" 
                                th:text="${'$' + #numbers.formatDecimal(item.valoresPorFuente.get(f).apropiacionDefinitiva, 1, 'POINT', 0, 'COMMA')}">$0</td>
                            <td class="text-end fw-bold text-success" 
                                th:text="${'$' + #numbers.formatDecimal(item.valoresPorFuente.get(f).saldoDisponible, 1, 'POINT', 0, 'COMMA')}">$0</td>
                        </th:block>

                        <!-- Total Consolidado -->
                        <td class="text-end fw-bold fs-6 bg-light" 
                            th:text="${'$' + #numbers.formatDecimal(item.disponibleTotal, 1, 'POINT', 0, 'COMMA')}">$0</td>

                        <!-- Barra de Avance -->
                        <td>
                            <div class="progress" style="height: 18px;">
                                <div class="progress-bar bg-info text-dark fw-bold" 
                                     role="progressbar" 
                                     th:style="'width: ' + ${item.porcentajeEjecucion} + '%'"
                                     th:text="${item.porcentajeEjecucion + '%'}">0%</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

    <!-- Modal Registrar Movimiento -->
    <div class="modal fade" id="modalMovimiento" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Nuevo Acto Administrativo / Modificación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="formMovimiento">
                    <div class="modal-body">
                        <input type="hidden" id="proyectoId" th:value="${proyecto != null ? proyecto.id : ''}">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Tipo de Movimiento</label>
                                <select class="form-select" id="tipoMovimiento" required>
                                    <option th:each="tipo : ${tiposMovimiento}" th:value="${tipo}" th:text="${tipo}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Número Decreto / Soporte</label>
                                <input type="text" class="form-control" id="numeroDecreto" placeholder="Ej: Decreto No.0304" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Actividad Afectada</label>
                                <select class="form-select" id="actividadId" required>
                                    <option th:each="act : ${actividades}" th:value="${act.id}" th:text="${act.nombre}"></option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fuente Financiación</label>
                                <select class="form-select" id="fuente" required>
                                    <option th:each="f : ${fuentes}" th:value="${f}" th:text="${f}"></option>
                                </select>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Monto ($) <small class="text-muted">(Usar valores negativos para reducciones o CDP)</small></label>
                                <input type="number" step="0.01" class="form-control" id="monto" placeholder="Ej: 500000000 o -200000000" required>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="button" class="btn btn-primary" onclick="enviarMovimiento()">Guardar Cambio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        function enviarMovimiento() {
            const body = {
                proyectoId: document.getElementById('proyectoId').value,
                tipoMovimiento: document.getElementById('tipoMovimiento').value,
                numeroDecreto: document.getElementById('numeroDecreto').value,
                detalles: [{
                    actividadId: document.getElementById('actividadId').value,
                    fuente: document.getElementById('fuente').value,
                    monto: document.getElementById('monto').value
                }]
            };

            fetch('/api/presupuesto/movimiento', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            })
            .then(res => {
                if (!res.ok) return res.json().then(err => { throw new Error(err.mensaje); });
                return res.json();
            })
            .then(() => location.reload())
            .catch(err => alert("Error: " + err.message));
        }
    </script>
</section>
</body>
</html>
